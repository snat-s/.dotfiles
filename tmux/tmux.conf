# Reload with Ctrl+b r. Keep the standard Ctrl+b prefix.
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Mouse and trackpad scrolling, pane selection, and drag-to-resize.
# tmux's default wheel bindings enter scrollback or forward to the active app.
set -g mouse on
set -g history-limit 50000

# Vim-style movement and selection in scrollback (Ctrl+b [).
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Escape send-keys -X cancel
set -s set-clipboard external

# Responsive Escape and focus events for Neovim.
set -s escape-time 10
set -g focus-events on
set -s extended-keys on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# Ctrl+b followed by h/j/k/l selects a pane. Uppercase resizes it.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Open windows and splits in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Number from 1 and close gaps when windows are removed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

# A compact status bar with a clear active window and pane border.
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour117,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour244]%a %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=colour255,bold] #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"
set -g display-time 2000
